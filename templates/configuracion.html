<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Configuración</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='styles.css') }}">

</head>

<body>

<div class="content-page">

    <div class="page-card">

        <h1>⚙️ Configuración</h1>

        {% if mensaje %}

        <div class="success-box">

            {{ mensaje }}

        </div>

        {% endif %}

        <form method="POST">

            <div class="form-group">

                <label>
                    Contraseña Actual
                </label>

                <input
                type="password"
                name="actual"
                class="form-control"
                required>

            </div>

            <div class="form-group">

                <label>
                    Nueva Contraseña
                </label>

                <input
                type="password"
                name="nueva"
                class="form-control"
                required>

            </div>

            <button
            type="submit"
            class="btn-login">

                Guardar Cambios

            </button>

        </form>

        <a
        href="{{ url_for('dashboard') }}"
        class="btn-back">

            ← Volver al Dashboard

        </a>

    </div>

</div>

</body>
</html>
