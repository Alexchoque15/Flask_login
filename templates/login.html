<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Iniciar Sesión</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='styles.css') }}">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="logo-icon">

            🔐

        </div>

        <div class="logo">

            <h1>Bienvenido</h1>

            <p>Ingrese sus credenciales para continuar</p>

        </div>

        {% if error %}

        <div class="alert-error">

            {{ error }}

        </div>

        {% endif %}

        <form method="POST">

            <div class="form-group">

                <label>Usuario</label>

                <input
                type="text"
                name="username"
                class="form-control"
                required>

            </div>

            <div class="form-group">

                <label>Contraseña</label>

                <input
                type="password"
                name="password"
                class="form-control"
                required>

            </div>

            <button
            type="submit"
            class="btn-login">

                Ingresar

            </button>

            <a
            href="{{ url_for('registro') }}"
            class="btn-register">

                Crear Cuenta

            </a>

        </form>

    </div>

</div>

</body>
</html>
